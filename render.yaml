services:
  - type: web
    name: clan-war-room
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: COC_TOKEN
        sync: false
      - key: SARVAM_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLAN_TAG
        sync: false
      - key: BG_POLL_INTERVAL_MS
        value: "30000"
