services:
  - type: web
    name: clan-war-room
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: COC_TOKEN
        sync: false
      - key: SARVAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLAN_TAG
        sync: false
      - key: BG_POLL_INTERVAL_MS
        value: "30000"
      # Optional: shared secret to lock the dashboard down (see README). If set,
      # every API route requires the X-Access-Token header and the browser
      # asks for it once. Leave unset for open access.
      - key: RUKA_ACCESS_TOKEN
        sync: false
      # Optional: restrict CORS to one origin (e.g. your Render URL). Default: * (any origin).
      - key: ALLOWED_ORIGIN
        sync: false
